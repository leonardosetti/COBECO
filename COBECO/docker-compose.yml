services:
  postgres:
    image: postgres:16-alpine
    container_name: cobeco-postgres
    environment:
      POSTGRES_DB: cobeco
      POSTGRES_USER: cobeco_user
      POSTGRES_PASSWORD: cobeco_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobeco_user -d cobeco"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://cobeco_user:cobeco_dev_password@postgres:5432/cobeco?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-before-production-123456}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-before-production-654321}
      CORS_ORIGIN: http://localhost:5173
      ENABLE_EXTERNAL_PRICE_PROVIDERS: ${ENABLE_EXTERNAL_PRICE_PROVIDERS:-false}
    command: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run db:seed && npm run start --workspace apps/api"
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
