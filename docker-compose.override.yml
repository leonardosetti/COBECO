# COBECO MVP — Docker Compose Override (Desenvolvimento)
# Uso: docker compose -f config-docker-0001-config-docker-0001-config-docker-0001-config-docker-0001-config-docker-0002-docker-compose-override-v1-v1-v1.0-v1.0-v1.0.yml -f config-docker-0001-config-docker-0001-config-docker-0001-config-docker-0002-docker-compose-override-v1-v1-v1.0-v1.0.override.yml up
# Hot reload habilitado para backend e frontend

services:
  backend:
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
    environment:
      PYTHONPATH: /app
      LOG_LEVEL: DEBUG

  frontend:
    command: nginx -g "daemon off;" -c /etc/nginx/nginx.dev.conf
    volumes:
      - ./frontend:/app
      - ./frontend/config-nginx-0001-nginx-v1.0.dev.conf:/etc/nginx/nginx.dev.conf:ro

  proxy:
    # Em desenvolvimento, proxy aponta para containers com hot reload
    # Configuração padrão já funciona (herda do config-docker-0001-config-docker-0001-config-docker-0001-config-docker-0001-config-docker-0002-docker-compose-override-v1-v1-v1.0-v1.0-v1.0.yml)