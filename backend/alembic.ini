# COBECO Backend — Alembic Configuration
# Migrations para MySQL 8 InnoDB

[alembic]
# Template para scripts de migração
script_location = alembic

# Template de arquivo de migração
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone para timestamps
timezone = UTC

# SQLAlchemy URL (sobrescrito por env var DATABASE_URL em env.py)
sqlalchemy.url = mysql+pymysql://cobeco:cobeco@localhost:3306/cobeco

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S