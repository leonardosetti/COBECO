<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="COBECO — Comparação de Preços para Listas de Compras">
  <title>COBECO MVP</title>
  <link rel="stylesheet" href="/styles/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header / Navigation -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 no-print" id="header">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <svg class="w-8 h-8 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <h1 class="text-xl font-bold text-gray-900">COBECO</h1>
        <span class="text-xs bg-primary-100 text-primary-700 px-2 py-0.5 rounded-full font-medium">MVP</span>
      </div>
      <nav class="flex items-center gap-4" id="nav-auth">
        <!-- Preenchido via JS -->
      </nav>
    </div>
  </header>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2" aria-live="polite"></div>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8" id="main">
    <!-- Conteúdo dinâmico renderizado pelo router JS -->
  </main>

  <!-- Journey Panel — Painel da Jornada de Mariana (desktop ≥1024px) -->
  <div id="journey-panel" class="fixed bottom-4 right-4 z-40 hidden md:block w-72"></div>

  <!-- Footer -->
  <footer class="bg-gray-50 border-t border-gray-200 py-6 no-print" id="footer">
    <div class="max-w-7xl mx-auto px-6 text-center text-sm text-gray-500">
      <p>COBECO MVP — FATEC Taquaritinga — Análise e Desenvolvimento de Sistemas</p>
      <p class="mt-1">Dados mockados para fins acadêmicos — Não representa preços reais de mercado</p>
    </div>
  </footer>

  <!-- Modal Container -->
  <div id="modal-container" class="hidden" aria-hidden="true"></div>

  <!-- Scripts -->
  <script defer src="/app.js"></script>
</body>
</html>
