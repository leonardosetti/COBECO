<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBECO — Protótipo Alta Fidelidade v3.2 (Live Demo)</title>
<style>
:root{
  --pri:#4f46e5; --pri-d:#4338ca; --pri-bg:#eef2ff;
  --ok:#16a34a; --ok-d:#15803d; --ok-bg:#ecfdf5; --ok-line:#86efac;
  --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fcd34d;
  --err:#dc2626; --err-bg:#fef2f2;
  --ink:#0f172a; --mut:#64748b; --soft:#94a3b8; --line:#e2e8f0; --bg:#f5f6fa; --card:#fff;
  --r:12px; --sh:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px;border-radius:6px}
.app-shell{min-height:100vh;display:flex;flex-direction:column}
.container{max-width:1180px;margin:0 auto;padding:0 24px;width:100%}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:28px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--ink);text-decoration:none;letter-spacing:.3px}
.logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo small{display:block;font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.4px}
nav.main{display:flex;gap:4px;flex:1}
nav.main a{padding:8px 13px;border-radius:8px;color:#334155;text-decoration:none;font-weight:600;font-size:14px}
nav.main a:hover{background:#f1f5f9}
nav.main a.on{background:var(--pri-bg);color:var(--pri)}
.auth-zone{display:flex;align-items:center;gap:10px}
.userchip{display:flex;align-items:center;gap:8px;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok-d);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14px;transition:background .15s,transform .05s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--pri);color:#fff}.btn-pri:hover{background:var(--pri-d)}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:var(--ok-d)}
.btn-ghost{background:#fff;border-color:var(--line);color:#334155}.btn-ghost:hover{background:#f8fafc}
.btn-danger{background:#fff;border-color:#fecaca;color:var(--err)}.btn-danger:hover{background:var(--err-bg)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn-lg{padding:14px 24px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn .lk{font-size:12px}
.linklike{background:none;border:none;color:var(--pri);font-weight:600;font-size:13px;padding:4px;text-decoration:underline}
.hint-disabled{font-size:12.5px;color:var(--mut);margin-top:8px;display:flex;gap:6px;align-items:center}

/* ---------- Layout cards ---------- */
main{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-pad{padding:26px}
.page{padding:34px 0 90px}
.page-head{margin-bottom:22px}
.page-head .kicker{font-size:12px;font-weight:800;letter-spacing:1.2px;color:var(--pri);text-transform:uppercase}
.page-head h1{font-size:26px;margin:6px 0 4px}
.page-head p{color:var(--mut);max-width:760px}

/* ---------- Stepper ---------- */
.stepper{display:flex;align-items:flex-start;gap:0;margin:8px 0 26px}
.stp{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;width:150px}
.stp .dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:#e2e8f0;color:#64748b;border:2px solid transparent}
.stp .lb{font-size:12px;font-weight:700;color:var(--mut);text-align:center}
.stp.active .dot{background:var(--pri);color:#fff}
.stp.active .lb{color:var(--pri)}
.stp.done .dot{background:var(--ok-bg);color:var(--ok-d);border-color:var(--ok-line)}
.stp.done{cursor:pointer}
.stp-bar{flex:1;height:2px;background:var(--line);margin-top:17px;border-radius:2px}
.stp-bar.done{background:var(--ok-line)}

/* ---------- Home ---------- */
.hero{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 55%,#4f46e5 100%);color:#fff;border-radius:18px;padding:52px 48px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;box-shadow:var(--sh)}
.hero .tag{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:5px 14px;font-size:12.5px;font-weight:700;margin-bottom:16px}
.hero h1{font-size:34px;line-height:1.2;margin-bottom:14px}
.hero p{color:#c7d2fe;font-size:16px;margin-bottom:26px;max-width:520px}
.hero .cta-row{display:flex;gap:12px;flex-wrap:wrap}
.btn-white{background:#fff;color:var(--pri-d)}
.btn-white:hover{background:#eef2ff}
.btn-outlinew{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn-outlinew:hover{background:rgba(255,255,255,.1)}
.mini-compare{background:#fff;color:var(--ink);border-radius:14px;padding:20px;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.mini-compare h4{font-size:13px;color:var(--mut);margin-bottom:12px;font-weight:700}
.mini-row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;font-size:13.5px;margin-bottom:6px;border:1px solid var(--line)}
.mini-row b{font-variant-numeric:tabular-nums}
.mini-row.win{background:var(--ok-bg);border-color:var(--ok-line)}
.mini-foot{font-size:12px;color:var(--mut);margin-top:10px;display:flex;justify-content:space-between}
.value-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
.vcard{padding:22px}
.vcard .ic{width:42px;height:42px;border-radius:10px;background:var(--pri-bg);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.vcard h3{font-size:16px;margin-bottom:6px}
.vcard p{font-size:13.5px;color:var(--mut)}
.howto{display:flex;gap:0;margin-top:18px;align-items:stretch}
.how{flex:1;text-align:center;padding:16px 10px;position:relative}
.how .n{width:30px;height:30px;margin:0 auto 8px;border-radius:50%;background:var(--pri-bg);color:var(--pri);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.how b{display:block;font-size:13.5px}
.how span{font-size:12px;color:var(--mut)}
.how:not(:last-child)::after{content:"→";position:absolute;right:-7px;top:22px;color:var(--soft);font-size:15px}
.persona-strip{margin-top:26px;display:flex;gap:16px;align-items:center;padding:20px 24px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--r)}
.persona-strip .av{font-size:34px}
.persona-strip b{display:block}
.persona-strip p{font-size:13.5px;color:#78350f}

/* ---------- Categorias ---------- */
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cat-card{display:flex;align-items:center;gap:11px;padding:14px 15px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:border-color .12s, background .12s;user-select:none}
.cat-card:hover{border-color:#c7d2fe}
.cat-card.sel{border-color:var(--pri);background:var(--pri-bg)}
.cat-card input{accent-color:var(--pri);width:17px;height:17px}
.cat-card .ci{font-size:20px}
.cat-card .cn{font-weight:700;font-size:13.5px;line-height:1.25}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.count-chip{font-size:13px;font-weight:700;color:var(--mut);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:99px}
.count-chip.ok{color:var(--ok-d);border-color:var(--ok-line);background:var(--ok-bg)}

/* ---------- Lista ---------- */
.two-col{display:grid;grid-template-columns:1fr 330px;gap:22px;align-items:start}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field .req{color:var(--err)}
.field input[type=text],.field input[type=password],.field input[type=email],.field select{width:100%;padding:11px 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}
.field input:focus,.field select:focus{border-color:var(--pri)}
.field .err-msg{color:var(--err);font-size:12.5px;margin-top:5px;display:none;font-weight:600}
.field.invalid input,.field.invalid select{border-color:var(--err)}
.field.invalid .err-msg{display:block}
.counter{font-size:12px;color:var(--mut);text-align:right;margin-top:4px}
.searchbox{position:relative}
.sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.14);z-index:30;overflow:hidden}
.sug-item{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid #f1f5f9}
.sug-item:hover,.sug-item.hot{background:var(--pri-bg)}
.sug-item .un{color:var(--mut);font-size:12px}
.sug-empty{padding:12px 14px;color:var(--mut);font-size:13.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:10px 12px;border-bottom:2px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.qty{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:30px;border:none;background:#f8fafc;font-weight:800;font-size:15px;color:#334155}
.qty button:hover{background:#eef2ff}
.qty input{width:52px;height:30px;border:none;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.icon-del{border:none;background:none;color:var(--soft);font-size:16px;padding:6px;border-radius:7px}
.icon-del:hover{background:var(--err-bg);color:var(--err)}
.resumo{position:sticky;top:84px}
.resumo h3{font-size:15px;margin-bottom:14px}
.res-line{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.res-line b{font-variant-numeric:tabular-nums}
.mode-chip{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:4px 10px;letter-spacing:.4px}
.mode-eph{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.mode-db{background:var(--ok-bg);color:var(--ok-d);border:1px solid var(--ok-line)}
.actions-stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.tip{background:#f8fafc;border:1px dashed var(--line);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--mut);margin-top:14px}

/* ---------- Fornecedores ---------- */
.slider-box{padding:18px 20px;margin-bottom:18px}
.slider-box .sl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.slider-box output{font-weight:800;color:var(--pri);background:var(--pri-bg);border-radius:8px;padding:3px 10px;font-size:13.5px}
input[type=range]{width:100%;accent-color:var(--pri);height:6px}
.sl-scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--soft);margin-top:6px}
.forn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.forn-card{border:2px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff;cursor:pointer;transition:border-color .12s,background .12s}
.forn-card:hover{border-color:#c7d2fe}
.forn-card.sel{border-color:var(--pri);background:var(--pri-bg)}
.forn-card.off{opacity:.55;cursor:not-allowed;background:#f8fafc}
.forn-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.forn-top b{font-size:14.5px}
.cov-badge{font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 9px;white-space:nowrap}
.cov-hi{background:var(--ok-bg);color:var(--ok-d)}
.cov-md{background:var(--warn-bg);color:var(--warn)}
.cov-lo{background:#f1f5f9;color:var(--mut)}
.forn-cats{display:flex;flex-wrap:wrap;gap:5px}
.mini-tag{font-size:10.5px;font-weight:700;background:#f1f5f9;color:#475569;border-radius:6px;padding:2.5px 7px}
.forn-cb-row{display:flex;gap:9px;align-items:flex-start}
.forn-cb-row input{margin-top:3px;accent-color:var(--pri);width:16px;height:16px}

/* ---------- Resultados ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{padding:16px 18px}
.kpi .k{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:20px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.kpi.win{border-color:var(--ok-line);background:var(--ok-bg)}
.kpi.win .v{color:var(--ok-d)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:99px;padding:3.5px 10px}
.b-ok{background:var(--ok-bg);color:var(--ok-d);border:1px solid var(--ok-line)}
.b-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.b-mut{background:#f1f5f9;color:var(--mut)}
.cov-bar{width:110px;height:7px;border-radius:99px;background:#e2e8f0;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.cov-bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
tr.row-win td{background:var(--ok-bg)}
tr.row-win td:first-child{border-left:4px solid var(--ok)}
.warn-banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-line);color:#78350f;border-radius:10px;padding:12px 15px;font-size:13.5px;margin:16px 0}
.rule-note{font-size:12.5px;color:var(--mut);margin-top:12px}

/* ---------- Vencedora ---------- */
.win-hero{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:24px 28px;border:2px solid var(--ok-line);background:var(--ok-bg);border-radius:var(--r);margin-bottom:20px;flex-wrap:wrap}
.win-hero h2{font-size:22px}
.win-hero .meta{font-size:13px;color:var(--mut);margin-top:4px}
.total-box{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;border:2px solid var(--ink);border-radius:12px;margin-top:16px;background:#fff}
.total-box .tl{font-size:13px;font-weight:800;letter-spacing:.8px;color:var(--mut);text-transform:uppercase}
.total-box .tv{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.export-note{margin-top:14px;font-size:13px;color:var(--mut);display:flex;gap:8px}

/* ---------- Auth ---------- */
.auth-wrap{max-width:460px;margin:0 auto}
.auth-card{padding:32px}
.auth-card h1{font-size:22px;margin-bottom:6px}
.auth-card .sub{color:var(--mut);font-size:14px;margin-bottom:22px}
.auth-foot{margin-top:18px;text-align:center;font-size:13.5px;color:var(--mut)}
.demo-hint{background:var(--pri-bg);border:1px dashed #c7d2fe;color:var(--pri-d);border-radius:10px;padding:10px 13px;font-size:12.5px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.step-pill{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--pri);text-transform:uppercase}

/* ---------- Dashboard ---------- */
.empty{text-align:center;padding:48px 20px;color:var(--mut)}
.empty .big{font-size:40px;margin-bottom:10px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-width:520px;width:100%;padding:28px;position:relative;max-height:90vh;overflow:auto;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}
.modal h3{font-size:18px;margin-bottom:8px}
.modal .x{position:absolute;top:14px;right:14px;border:none;background:#f1f5f9;border-radius:8px;width:30px;height:30px;font-size:14px;color:#475569}
.modal .x:hover{background:#e2e8f0}
.modal-pdf{max-width:860px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- A4 sheet ---------- */
.a4-sheet{background:#fff;color:#111;border:1px solid var(--line);box-shadow:var(--sh);padding:44px 48px;font-size:13.5px;line-height:1.55}
.a4-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:16px}
.a4-head .brand{font-size:22px;font-weight:800;letter-spacing:.5px}
.a4-head .brand small{display:block;font-size:10.5px;font-weight:600;color:#666;letter-spacing:1.2px}
.a4-head .doc{text-align:right;font-size:11.5px;color:#444}
.a4-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:12.5px;margin-bottom:16px;color:#333}
.a4-meta b{color:#000}
.a4-tbl{width:100%;border-collapse:collapse;margin-bottom:14px}
.a4-tbl th{background:#f1f2f4;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border:1px solid #d5d9de}
.a4-tbl td{padding:8px 10px;border:1px solid #d5d9de;font-size:12.5px}
.a4-tbl td.num,.a4-tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.a4-total{display:flex;justify-content:flex-end;gap:14px;align-items:center;font-size:15px;padding:10px;border:2px solid var(--ink);border-radius:6px;margin-bottom:14px}
.a4-total b{font-size:19px;font-variant-numeric:tabular-nums}
.a4-foot{font-size:10.5px;color:#666;border-top:1px solid #d5d9de;padding-top:10px;display:flex;justify-content:space-between}

/* ---------- Toast ---------- */
#toasts{position:fixed;top:76px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:380px}
.toast{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.2);padding:13px 16px;font-size:13.5px;border-left:4px solid var(--pri);animation:slidein .2s ease}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--err)} .toast.warn{border-left-color:#f59e0b}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Journey ---------- */
#journey{position:fixed;right:18px;bottom:18px;z-index:90;width:330px}
.j-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(15,23,42,.16);overflow:hidden}
.j-head{display:flex;gap:10px;align-items:center;padding:12px 14px;background:linear-gradient(135deg,#312e81,#4f46e5);color:#fff;cursor:pointer}
.j-head .av{font-size:22px}
.j-head b{font-size:13.5px;display:block}
.j-head span{font-size:11px;opacity:.85}
.j-head .tgl{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:7px;padding:4px 9px;font-size:12px}
.j-body{padding:12px 14px;max-height:320px;overflow:auto}
.j-step{display:flex;gap:9px;padding:6px 0;font-size:12.5px;color:var(--mut);align-items:flex-start}
.j-step .st{width:18px;height:18px;border-radius:50%;background:#e2e8f0;color:#64748b;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.j-step.done{color:#334155}.j-step.done .st{background:var(--ok-bg);color:var(--ok-d)}
.j-step.cur{color:var(--ink);font-weight:700}.j-step.cur .st{background:var(--pri);color:#fff}
.j-desc{font-size:12px;color:var(--mut);padding:8px 0 4px;border-top:1px dashed var(--line);margin-top:6px}

function calcularResultado(){
 const itens=state.lista.itens;
 const rows=state.fornecedores.map(fid=>{
  const f=FORNECEDORES.find(x=>x.id===fid);
  const disp=itens.filter(i=>temOferta(fid,i.pid));
  const aus=itens.filter(i=>!temOferta(fid,i.pid));
  const cobertura=disp.length/itens.length;
  const total=disp.reduce((s,i)=>s+preco(fid,i.pid)*i.qtd,0);
  return {fid,nome:f.nome,cnpj:f.cnpj,cobertura,nDisp:disp.length,ausentes:aus,total,parcial:aus.length>0};
 });
 const winner=rows.slice().sort((a,b)=>b.cobertura-a.cobertura||a.total-b.total)[0]; /* monografia */
 const display=rows.slice().sort((a,b)=>a.total-b.total); /* RF15: ordem por preço ASC */
 state.resultado={rows:display,winner,minTotal:Math.min(...rows.map(r=>r.total)),
  maxTotal:Math.max(...rows.map(r=>r.total))};
}
function coberturaDe(fid){const it=state.lista.itens;if(!it.length)return 0;
 return it.filter(i=>temOferta(fid,i.pid)).length/it.length;}

  </div>

   </div>
  </div></div>`;
}
function fornCardsHTML(){
 const eleg=fornecedoresElegiveis();
 if(!eleg.length)return `<div class="empty" style="grid-column:1/-1"><div class="big">🔎</div>Nenhum fornecedor disponível nas categorias selecionadas.<br>Tente incluir outras categorias.</div>`;
 return eleg.map(f=>{
  const cov=Math.round(coberturaDe(f.id)*100);
  const passa=cov>=state.filtroDisp;
  const sel=state.fornecedores.includes(f.id);
  const cls=cov>=80?"cov-hi":cov>=40?"cov-md":"cov-lo";
  return `<label class="forn-card ${sel?"sel":""} ${passa?"":"off"}" data-forncard="${f.id}">
   <div class="forn-cb-row"><input type="checkbox" class="forn-cb" value="${f.id}" ${sel?"checked":""} ${passa?"":"disabled"}>
   <div style="flex:1"><div class="forn-top"><b>${f.nome}</b>
     <span class="cov-badge ${cls}" title="Itens da sua lista disponíveis neste fornecedor">${cov}% da lista</span></div>
    <div class="forn-cats">${f.cats.filter(c=>state.categorias.includes(c)).map(c=>`<span class="mini-tag">${CATEGORIAS.find(x=>x.id===c).nome}</span>`).join("")}</div>
    ${cov===0?`<div class="small muted" style="margin-top:6px">⚠ Não possui itens da sua lista</div>`:""}
   </div></div></label>`;}).join("");
}
function refreshFornecedores(){
 document.getElementById("forn-grid").innerHTML=fornCardsHTML();
 const c=document.getElementById("forn-count");
 c.textContent=`${state.fornecedores.length} selecionado(s) · mín 2 · máx 10`;
 c.classList.toggle("ok",state.fornecedores.length>=2);
 const b=document.getElementById("btn-calc");b.disabled=state.fornecedores.length<2;
 const h=b.nextElementSibling;if(h&&h.classList.contains("hint-disabled"))h.style.display=state.fornecedores.length>=2?"none":"flex";
}

/* ---- Passo 4: Resultados (UC06/UC07) ---- */
function vResultados(){
 if(!state.resultado)return vFornecedores();
 const R=state.resultado;const W=R.winner;
 const avg=Math.round(R.rows.reduce((s,r)=>s+r.cobertura,0)/R.rows.length*100);
 const eco=R.maxTotal-W.total;
 return `<div class="container page">
  <div class="page-head"><span class="kicker">Passo 4 de 5 · Resultados</span>
   <h1>Comparação de preços</h1>
   <p>Lista “${esc(state.lista.nome)||"(sem nome)"}” · ${state.lista.itens.length} itens · ${R.rows.length} fornecedores. Ordenado pelo menor total (RF15); melhor oferta destacada (RF16).</p></div>
  ${stepperHTML(4)}
  <div class="kpis">
   <div class="card kpi win"><div class="k">🏆 Melhor oferta</div><div class="v">${W.nome}</div><div class="s">${BRL(W.total)} · ${Math.round(W.cobertura*100)}% da lista</div></div>
   <div class="card kpi"><div class="k">💰 Menor preço</div><div class="v">${BRL(R.minTotal)}</div><div class="s">pode ter itens ausentes</div></div>
   <div class="card kpi"><div class="k">📊 Economia potencial</div><div class="v">${BRL(eco>0?eco:0)}</div><div class="s">vs. maior total cotado</div></div>
   <div class="card kpi"><div class="k">Disponibilidade média</div><div class="v">${avg}%</div><div class="s">${R.rows.length} fornecedores comparados</div></div>
  </div>
  <div class="card" style="overflow:auto">
   <table class="tbl"><thead><tr><th style="width:44px">#</th><th>Fornecedor</th><th>Cobertura</th><th>Itens</th><th>Ausentes</th><th style="text-align:right">Preço total</th></tr></thead><tbody>
   ${R.rows.map((r,i)=>{
    const isW=r.fid===W.fid,isMin=r.total===R.minTotal;
    return `<tr class="${isW?"row-win":""}">
     <td class="muted">${i+1}</td>
     <td><b>${r.nome}</b> ${isW?`<span class="badge b-ok">🏆 Melhor oferta</span>`:""} ${isMin&&!isW?`<span class="badge b-warn">💰 Menor preço</span>`:""}</td>
     <td><span class="cov-bar"><i style="width:${Math.round(r.cobertura*100)}%"></i></span>${Math.round(r.cobertura*100)}%</td>
     <td>${r.nDisp} de ${state.lista.itens.length}</td>
     <td>${r.parcial?`<span class="badge b-warn" title="${r.ausentes.map(a=>esc(PRODUTOS.find(p=>p.id===a.pid).nome)).join("; ")}">⚠ ${r.ausentes.length} item(ns)</span>`:`<span class="muted">—</span>`}</td>
     <td style="text-align:right;font-weight:800;font-variant-numeric:tabular-nums">${BRL(r.total)}${r.parcial?` <span class="badge b-mut" title="Total parcial: considera apenas itens disponíveis">parcial</span>`:""}</td></tr>`;}).join("")}
   </tbody></table>
  </div>
  <div class="warn-banner"><span>⚠️</span><span><b>Atenção:</b> o menor preço pode não incluir todos os itens da sua lista. A melhor oferta considera a <b>maior cobertura</b>; em caso de empate, vence o <b>menor total</b> — verifique a coluna “Ausentes” (passe o mouse no badge).</span></div>
  <div class="row-between">
   <button class="btn btn-ghost" data-action="goto-step" data-step="fornecedores">← Editar fornecedores</button>
   <div style="display:flex;gap:10px;flex-wrap:wrap">

   </div>
  </div>
  <p class="rule-note">Regra da melhor oferta (monografia/RF16): maior percentual de cobertura da lista; empate → menor custo total. A comparação não é persistida (YAGNI).</p>
 </div>`;
}

 if(!u||u.senha!==pass){state.attempts++;
  if(state.attempts>=6){state.lockedUntil=Date.now()+15*60*1000;state.attempts=0;toast("🔒 6 tentativas falhas — bloqueio de 15 minutos (RF02).","err");}
  else toast(`Credenciais inválidas. (mensagem genérica · tentativa ${state.attempts}/6)`,"err");
  return false;}
 state.attempts=0;state.user=u.nome_usuario;
 toast(`✅ Bem-vinda(o), ${u.nome.split(" ")[0]}! Sessão ativa — token em memória, cookie httpOnly simulado.`,"ok");

/* submits */
document.addEventListener("submit",e=>{
 const id=e.target.id;if(!id)return;e.preventDefault();
 const val=x=>{const n=document.getElementById(x);return n?n.value.trim():"";};
 const bad=(fid)=>{const f=document.getElementById(fid);if(f)f.classList.add("invalid");};
 const clear=fid=>{const f=document.getElementById(fid);if(f)f.classList.remove("invalid");};
 if(id==="form-login"||id==="form-login-modal"){
  const u=id==="form-login"?val("l-user"):val("m-user"),p=id==="form-login"?val("l-pass"):val("m-pass");
  if(!u||!p){toast("Informe usuário e senha.","err");return;}
  if(loginCore(u,p)){closeModal();afterLogin();}else if(id==="form-login")render();
 }
 else if(id==="form-cad"){
  let ok=true;["fc-u","fc-n","fc-e","fc-s","fc-c","fc-p","fc-r"].forEach(clear);
  const u=val("c-user"),n=val("c-nome"),em=val("c-email"),s=val("c-senha"),c=val("c-conf"),pg=val("c-perg"),r=val("c-resp");
  if(!/^[a-zA-Z0-9]{3,30}$/.test(u)||USERS.some(x=>x.nome_usuario===u)){bad("fc-u");ok=false;}
  if(n.length<2||n.length>100){bad("fc-n");ok=false;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)||USERS.some(x=>x.email===em)){bad("fc-e");ok=false;}
  if(!(s.length>=8&&/[A-Z]/.test(s)&&/\d/.test(s)&&/[^A-Za-z0-9]/.test(s))){bad("fc-s");ok=false;}
  if(c!==s){bad("fc-c");ok=false;}
  if(!pg){bad("fc-p");ok=false;}
  if(r.length<3){bad("fc-r");ok=false;}
  if(!ok){toast("Verifique os campos destacados.","err");return;}
  USERS.push({nome_usuario:u,nome:n,email:em,senha:s,pergunta:pg,resposta:r,criado_em:hoje()});
  toast("✅ Conta criada com sucesso! Agora faça login. (201 Created)","ok");go("login");
 }
 else if(id==="form-rec1"){const u=val("r-user");clear("fr-u");
  if(!USERS.some(x=>x.nome_usuario===u)){bad("fr-u");toast("Usuário não encontrado.","err");return;}
  state.recUser=u;state.recStep=2;render();}
 else if(id==="form-rec2"){const u=USERS.find(x=>x.nome_usuario===state.recUser);clear("fr-r");
  if(val("r-resp").toLowerCase()!==u.resposta.toLowerCase()){bad("fr-r");toast("Resposta incorreta (máx. 3 tentativas).","err");return;}
  toast("✔ Resposta validada. Token de reset emitido (uso único · 15 min).","ok");state.recStep=3;render();}
 else if(id==="form-rec3"){const u=USERS.find(x=>x.nome_usuario===state.recUser);let ok=true;["fr-s","fr-c"].forEach(clear);
  const s=val("r-senha"),c=val("r-conf");
  if(!(s.length>=8&&/[A-Z]/.test(s)&&/\d/.test(s)&&/[^A-Za-z0-9]/.test(s))||s===u.senha){bad("fr-s");ok=false;}
  if(c!==s){bad("fr-c");ok=false;}
  if(!ok){toast("Verifique a nova senha.","err");return;}
  u.senha=s;state.recStep=1;toast("✅ Senha redefinida! Faça login com a nova senha.","ok");go("login");}
 else if(id==="form-perfil"){const u=USERS.find(x=>x.nome_usuario===state.user);let ok=true;["fp-n","fp-e","fp-a","fp-s"].forEach(clear);
  const n=val("p-nome"),em=val("p-email"),at=val("p-atual"),nv=val("p-nova");
  if(n.length<2||n.length>100){bad("fp-n");ok=false;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)||USERS.some(x=>x.email===em&&x.nome_usuario!==u.nome_usuario)){bad("fp-e");ok=false;}
  if(at!==u.senha){bad("fp-a");ok=false;}
  if(nv&&(!(nv.length>=8&&/[A-Z]/.test(nv)&&/\d/.test(nv)&&/[^A-Za-z0-9]/.test(nv))||nv===u.senha)){bad("fp-s");ok=false;}
  if(!ok){toast("Verifique os campos destacados.","err");return;}
  u.nome=n;u.email=em;if(nv)u.senha=nv;state.perfilEdit=false;
  toast("✅ Perfil atualizado (transação ACID simulada).","ok");render();}
});

  const l=(LISTAS[state.user]||[]).find(x=>x.id===id);
  document.getElementById("btn-excl").disabled=t.value.trim()!==l.nome;}
 else if(t.dataset.qtdix!==undefined){const ix=+t.dataset.qtdix;let v=parseInt(t.value,10);
  if(isNaN(v))v=1;v=Math.min(9999,Math.max(1,v));state.lista.itens[ix].qtd=v;persistEph();}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.classList.contains("cat-cb")){const id=+t.value;
  state.categorias=state.categorias.includes(id)?state.categorias.filter(x=>x!==id):[...state.categorias,id];
  const card=t.closest("[data-catcard]");if(card)card.classList.toggle("sel",state.categorias.includes(id));
  const c=document.getElementById("cat-count");
  c.textContent=`${state.categorias.length} categoria(s) selecionada(s) · 11 disponíveis`;
  c.classList.toggle("ok",state.categorias.length>0);
  const b=document.getElementById("btn-to-lista");b.disabled=!state.categorias.length;
  const h=b.nextElementSibling;if(h&&h.classList.contains("hint-disabled"))h.style.display=state.categorias.length?"none":"flex";}
 else if(t.classList.contains("forn-cb")){const id=+t.value;
  if(state.fornecedores.length>=10&&!state.fornecedores.includes(id)){toast("Máximo de 10 fornecedores (RF13).","warn");t.checked=false;return;}
  state.fornecedores=state.fornecedores.includes(id)?state.fornecedores.filter(x=>x!==id):[...state.fornecedores,id];
  const card=t.closest("[data-forncard]");if(card)card.classList.toggle("sel",state.fornecedores.includes(id));
  refreshFornecedores();}
});
let sugTimer=null;
function updateSugestoes(){
 const box=document.getElementById("sug-box");if(!box)return;
 const q=norm(state.busca);
 if(q.length<2){box.innerHTML="";return;}
 box.innerHTML=`<div class="sug"><div class="sug-empty">🔎 Buscando no catálogo…</div></div>`;
 clearTimeout(sugTimer);
 sugTimer=setTimeout(()=>{
  const hits=PRODUTOS.filter(p=>norm(p.nome).includes(q)).slice(0,6);
  box.innerHTML=hits.length?`<div class="sug" role="listbox">${hits.map(p=>
   `<div class="sug-item" data-action-add="${p.id}" role="option"><span>${esc(p.nome)}</span><span class="un">por unidade de venda: ${p.un}</span></div>`).join("")}</div>`
  :`<div class="sug"><div class="sug-empty">Nenhum produto encontrado — tente outro termo.</div></div>`;
 },280);
}
document.addEventListener("click",e=>{
 const s=e.target.closest("[data-action-add]");if(!s)return;
 const pid=+s.dataset.actionAdd;
 const ex=state.lista.itens.find(i=>i.pid===pid);
 if(ex)ex.qtd=Math.min(9999,ex.qtd+1);else state.lista.itens.push({pid,qtd:1});
 state.busca="";const b=document.getElementById("busca");if(b)b.value="";
 document.getElementById("sug-box").innerHTML="";persistEph();refreshListaUI();
 const p=PRODUTOS.find(x=>x.id===pid);
 toast(`➕ ${p.nome} adicionado${ex?" (quantidade somada)":""}.`,"ok");
});

/* ---------- Boot ---------- */
loadEph();
render();
</script>
</body>
</html>
