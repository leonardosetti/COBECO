version: '3.8'

# COBECO MVP — Docker Compose Staging (Homologação)
# Porta: 8480 (evita conflito com dev 8380)
# Uso: docker compose -f docker-compose.stage.yml up -d
# Para parar: docker compose -f docker-compose.stage.yml down

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: cobeco-db-stage
    environment:
      POSTGRES_DB: cobeco_stage
      POSTGRES_USER: cobeco
      POSTGRES_PASSWORD: cobeco
      POSTGRES_ROOT_PASSWORD: root
    volumes:
      - cobeco-db-stage-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - cobeco-stage-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobeco -d cobeco_stage"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: config-docker-0003-backend-dockerfile-v1.0
    container_name: cobeco-backend-stage
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://cobeco:cobeco@cobeco-db-stage:5432/cobeco_stage
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIM: "384"
      SECRET_KEY: cobeco-secret-key-min-32-chars-for-jwt-signing-stage
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      PYTHONPATH: /app
      DEBUG: "false"
    networks:
      - cobeco-stage-data
      - cobeco-stage-edge
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: config-docker-0004-frontend-dockerfile-v1.0
    container_name: cobeco-frontend-stage
    command: nginx -g "daemon off;"
    networks:
      - cobeco-stage-edge
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    container_name: cobeco-proxy-stage
    ports:
      - "8480:8380"
    volumes:
      - ./proxy/config-nginx-0003-proxy-nginx-v1.0.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - cobeco-stage-edge

networks:
  cobeco-stage-data:
    name: cobeco-stage-data
    driver: bridge
  cobeco-stage-edge:
    name: cobeco-stage-edge
    driver: bridge

volumes:
  cobeco-db-stage-data:
    name: cobeco-db-stage-data
