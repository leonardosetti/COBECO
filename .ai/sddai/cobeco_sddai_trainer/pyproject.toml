[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cobeco-sddai-trainer"
version = "1.0.0"
description = "Treinamento de modelos ML para SDDAI (custom do zero)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cobeco-sddai-trainer = "cobeco_sddai_trainer.cli:main"

[tool.setuptools.config-npm-0001-config-npm-0001-config-npm-0001-package-v1-v1.0-v1.0s.find]
where = ["."]
include = ["cobeco_sddai_trainer*"]