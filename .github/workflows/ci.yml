name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: COBECO/package-lock.json
      - working-directory: COBECO
        run: npm ci
      - working-directory: COBECO
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - working-directory: COBECO
        run: npm run lint
      - working-directory: COBECO
        run: npm run test --workspaces -- --run
      - working-directory: COBECO
        run: npm run test:bdd --workspace apps/api
      - working-directory: COBECO
        run: npx playwright install --with-deps chromium
      - working-directory: COBECO
        run: npm run test:e2e --workspace apps/web
      - working-directory: COBECO
        run: npm run build
