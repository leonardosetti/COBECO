name: CI

on:
  push:
    branches: ["main", "stage", "feature/**"]
  pull_request:
    branches: ["main", "stage", "feature/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: cobeco
          POSTGRES_PASSWORD: cobeco
          POSTGRES_DB: cobeco
        options: >-
          --health-cmd "pg_isready -U cobeco -d cobeco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Executar migrations Alembic
        env:
          DATABASE_URL: postgresql+asyncpg://cobeco:cobeco@localhost:5432/cobeco
        run: |
          cd backend
          alembic upgrade head

      - name: Popular embeddings (backfill)
        env:
          DATABASE_URL: postgresql+asyncpg://cobeco:cobeco@localhost:5432/cobeco
        run: |
          cd backend
          python -m scripts.populate_embeddings || true

      - name: Executar testes
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/cobeco_test
        run: |
          cd backend
          pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build imagem backend
        run: |
          cd backend
          docker build -t cobeco-backend:latest -f config-docker-0003-backend-dockerfile-v1.0 .
