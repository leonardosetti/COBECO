# COBECO MVP — GitHub Actions CI Pipeline
# Executa: ruff (lint), pytest (testes + cobertura ≥80%), build Docker
# Deve rodar em <5 minutos (RNF07)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  SECRET_KEY: "test-secret-key-for-ci-only-32chars"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  RECOVERY_MODE: "log"
  DATABASE_URL: "mysql+asyncmy://test:test@localhost:3306/cobeco_test"
  DATABASE_ECHO: "false"
  DATABASE_POOL_SIZE: "5"
  DATABASE_MAX_OVERFLOW: "10"
  DEBUG: "true"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          cd backend
          ruff check src tests

      - name: Run black --check
        run: |
          cd backend
          black --check src tests

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cobeco_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "MySQL ready"
              break
            fi
            sleep 2
          done

      - name: Run migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/unit tests/integration tests/contract -v --tb=short --cov=src --cov-fail-under=80

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t cobeco-backend:test -f backend/config-docker-0003-backend-dockerfile-v1.0 backend/

      - name: Build frontend image
        run: |
          docker build -t cobeco-frontend:test -f frontend/config-docker-0004-frontend-dockerfile-v1.0 frontend/

      - name: Verify images
        run: |
          docker images cobeco-backend:test cobeco-frontend:test

  docker-compose:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose -f config-docker-0001-docker-compose-v1.0.yml up -d --build

      - name: Wait for services
        run: |
          sleep 30
          curl -f http://localhost:8380/health || exit 1
          curl -f http://localhost:8380/v1/health || exit 1

      - name: Run smoke tests
        run: |
          curl -f http://localhost:8380/openapi.json > /dev/null && echo "OpenAPI JSON accessible"
          curl -f http://localhost:8380/v1/docs > /dev/null && echo "OpenAPI docs accessible"

      - name: Cleanup
        run: |
          docker compose -f config-docker-0001-docker-compose-v1.0.yml down -v