version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: config-docker-0003-backend-dockerfile-v1.0
    container_name: cobeco-backend
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: mysql+asyncmy://cobeco:cobeco@cobeco-db:3306/cobeco
      SECRET_KEY: cobeco-secret-key-min-32-chars-for-jwt-signing
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      PYTHONPATH: /app
      DEBUG: "true"
      LOG_LEVEL: DEBUG
    networks:
      - edge
    volumes:
      - ./backend:/app
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: config-docker-0004-frontend-dockerfile-v1.0
    container_name: cobeco-frontend
    command: nginx -g "daemon off;"
    networks:
      - edge
    volumes:
      - ./frontend:/app
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    container_name: cobeco-proxy
    ports:
      - "8380:8380"
    volumes:
      - ./proxy/config-nginx-0003-proxy-nginx-v1.0.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - edge

networks:
  edge:
    driver: bridge
