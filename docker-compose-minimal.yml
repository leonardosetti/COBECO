version: '3.8'

services:
  cobeco-db:
    image: pgvector/pgvector:pg15
    container_name: cobeco-db
    environment:
      POSTGRES_USER: cobeco
      POSTGRES_PASSWORD: cobeco
      POSTGRES_DB: cobeco
    networks:
      - edge
    ports:
      - "5432:5432"
    volumes:
      - cobeco-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobeco -d cobeco"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: config-docker-0003-backend-dockerfile-v1.0
    container_name: cobeco-backend
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://cobeco:cobeco@cobeco-db:5432/cobeco
      SECRET_KEY: cobeco-secret-key-min-32-chars-for-jwt-signing
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      PYTHONPATH: /app
      DEBUG: "true"
      LOG_LEVEL: DEBUG
    networks:
      - edge
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    depends_on:
      cobeco-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobeco -d cobeco"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: config-docker-0004-frontend-dockerfile-v1.0
    container_name: cobeco-frontend
    command: nginx -g "daemon off;"
    networks:
      - edge
    volumes:
      - ./frontend:/app
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    container_name: cobeco-proxy
    ports:
      - "8380:8380"
    volumes:
      - ./proxy/config-nginx-0003-proxy-nginx-v1.0.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - edge

volumes:
  cobeco-db-data:

networks:
  edge:
    driver: bridge
